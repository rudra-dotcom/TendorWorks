name: Tenderworks regression gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run python -m tender.benchmarks --provider offline --model offline --layer workflow --output eval/results/ci-workflow
      - run: uv run python -m tender.benchmarks --provider offline --model offline --layer checkpoint --output eval/results/ci-checkpoint
      - run: uv run python -m tender.benchmarks --provider offline --model offline --layer retrieval --output eval/results/ci-retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval/results/ci-*
